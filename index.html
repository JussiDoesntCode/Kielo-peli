<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kielon metsäseikkailu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Yksi koko ruudun metsäkangas, HUD-pillerit yläreunassa, aloitus/loppu-kortti keskellä */
:root{
  --ink:#3b1a3e; --pink:#ff6fae; --pinkdeep:#d9468a; --cream:#fff5fa;
  --leaf:#2c6236; --gold:#ffc93c;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#24502d;color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:var(--display)}
#wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.pill{background:rgba(255,245,250,.92);border-radius:999px;padding:4px 14px;font-weight:800;font-size:20px;display:flex;gap:12px;box-shadow:0 2px 0 rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:var(--cream);color:var(--pinkdeep);font-weight:800;font-size:18px;padding:6px 16px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,40,24,.45);padding:16px}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 6px 0 var(--pinkdeep)}
.card h1{margin:0;font-size:32px;line-height:1.05;color:var(--pinkdeep);text-wrap:balance}
.card p{margin:10px 0 0;font-size:17px;line-height:1.35;font-weight:600}
.big{margin-top:18px;font:800 26px var(--display);color:#fff;background:var(--pink);border:0;border-radius:999px;padding:12px 34px;box-shadow:0 5px 0 var(--pinkdeep);cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pinkdeep)}
.big:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.legend{display:flex;justify-content:center;gap:14px;margin-top:12px;font-size:26px}
.score{font-size:24px;font-weight:800;margin-top:10px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pill"><span>🪙 <b id="sc">0</b></span><span>🌸 <b id="sf">0</b></span><span>💎 <b id="sd">0</b></span></div>
    <div class="pill" id="hearts">❤️❤️❤️</div>
  </div>
  <div id="toast"></div>
  <div id="overlay">
    <div class="card" id="card">
      <h1>Prinsessa Kielon metsäseikkailu</h1>
      <p>Pidä sormea ruudulla, niin Kielo kävelee sinne. Kerää rahoja, kukkia ja timantteja!</p>
      <div class="legend">🪙 🌸 💎</div>
      <p>Varo näkymätöntä varjoa. Sen tassunjäljet näkyvät maassa. Ota kiinni keiju, niin se suojaa sinua!</p>
      <button class="big" id="go">Aloita</button>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,bg=null;
const TOP=60; // HUD-alue

function rnd(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

/* ---------- Metsätausta ---------- */
function buildBg(){
  bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;
  const g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5fae4f');gr.addColorStop(1,'#468f3c');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // polku
  g.strokeStyle='rgba(222,190,130,.55)';g.lineWidth=46;g.lineCap='round';
  g.beginPath();g.moveTo(-20,H*.75);g.bezierCurveTo(W*.3,H*.45,W*.6,H*.95,W+20,H*.55);g.stroke();
  // ruohotupsut
  for(let i=0;i<W*H/900;i++){const x=Math.random()*W,y=Math.random()*H;
    g.strokeStyle=Math.random()<.5?'rgba(40,110,40,.5)':'rgba(140,210,110,.45)';g.lineWidth=1.5;
    g.beginPath();g.moveTo(x,y);g.lineTo(x-2,y-6);g.moveTo(x,y);g.lineTo(x+2,y-7);g.stroke();}
  // pikkukukat
  for(let i=0;i<W*H/9000;i++){const x=Math.random()*W,y=Math.random()*H;
    g.fillStyle=['#fff','#ffe36b','#c9b7ff'][i%3];g.beginPath();g.arc(x,y,2.2,0,7);g.fill();}
  // puut reunoilla
  const tree=(x,y,s)=>{
    g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(x,y+s*.9,s*.8,s*.25,0,0,7);g.fill();
    g.fillStyle='#6b4428';g.fillRect(x-s*.12,y+s*.2,s*.24,s*.7);
    ['#1f5a2c','#2a7036','#3a8a43'].forEach((c,k)=>{g.fillStyle=c;g.beginPath();g.arc(x,y-k*s*.18,s*(.75-k*.15),0,7);g.fill();});
  };
  for(let x=-10;x<W+40;x+=rnd(48,70)) tree(x,rnd(-10,18),rnd(34,46));
  for(let x=-10;x<W+40;x+=rnd(52,76)) tree(x,H-rnd(20,40),rnd(30,42));
  for(let y=60;y<H-40;y+=rnd(70,100)){tree(rnd(-24,-8),y,rnd(28,38));tree(W+rnd(8,24),y,rnd(28,38));}
}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildBg();}
addEventListener('resize',resize);resize();

/* ---------- Ääni ---------- */
let ac=null;
function beep(f,d=.12,type='sine',v=.12){if(!ac)return;try{const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;
  gn.gain.setValueAtTime(v,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

/* ---------- Tila ---------- */
let P,items,villain,fairy,fairyT,prints,parts,cnt,hearts,state='start',printT,target=null,keys={},time=0;
const bounds=()=>({x0:28,x1:W-28,y0:TOP+20,y1:H-44});

function farPoint(){const b=bounds();const c=[[b.x0,b.y0],[b.x1,b.y0],[b.x0,b.y1],[b.x1,b.y1]];
  c.sort((a,z)=>Math.hypot(z[0]-P.x,z[1]-P.y)-Math.hypot(a[0]-P.x,a[1]-P.y));return {x:c[0][0],y:c[0][1]};}

function reset(){
  P={x:W/2,y:H/2,r:22,face:1,walk:0,inv:0,glow:0};
  items=[];prints=[];parts=[];cnt={coin:0,flower:0,gem:0};hearts=3;
  villain=farPoint();villain.step=0;fairy=null;fairyT=8;printT=0;target=null;
  for(let i=0;i<6;i++)spawnItem();updHud();
}
function spawnItem(){const b=bounds();let t=Math.random();const type=t<.5?'coin':t<.85?'flower':'gem';
  let p,tries=0;do{p={x:rnd(b.x0+10,b.x1-10),y:rnd(b.y0+10,b.y1-10)};tries++;}while(P&&dist(p,P)<90&&tries<20);
  items.push({...p,type,ph:Math.random()*6});}

function updHud(){$('sc').textContent=cnt.coin;$('sf').textContent=cnt.flower;$('sd').textContent=cnt.gem;
  $('hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(3-hearts);}
let toastT;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
function burst(x,y,col,n=12){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(40,140);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7,c:col});}}

/* ---------- Ohjaus ---------- */
function setT(e){const r=cv.getBoundingClientRect();target={x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{setT(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(target)setT(e);});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>target=null));
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);

/* ---------- Päivitys ---------- */
function update(dt){
  time+=dt;
  // prinsessa
  let dx=0,dy=0;
  if(target){dx=target.x-P.x;dy=target.y-P.y;const d=Math.hypot(dx,dy);if(d<6){dx=dy=0}else{dx/=d;dy/=d}}
  if(keys.ArrowLeft)dx=-1;if(keys.ArrowRight)dx=1;if(keys.ArrowUp)dy=-1;if(keys.ArrowDown)dy=1;
  const sp=230;P.x+=dx*sp*dt;P.y+=dy*sp*dt;if(dx)P.face=dx>0?1:-1;
  if(dx||dy)P.walk+=dt*10;
  const b=bounds();P.x=Math.max(b.x0,Math.min(b.x1,P.x));P.y=Math.max(b.y0,Math.min(b.y1,P.y));
  P.inv=Math.max(0,P.inv-dt);P.glow=Math.max(0,P.glow-dt);

  // aarteet
  for(let i=items.length-1;i>=0;i--){const it=items[i];
    if(P.glow>0&&dist(it,P)<140){it.x+=(P.x-it.x)*dt*4;it.y+=(P.y-it.y)*dt*4;}
    if(dist(it,P)<P.r+16){items.splice(i,1);cnt[it.type]++;
      burst(it.x,it.y,it.type==='coin'?'#ffc93c':it.type==='flower'?'#ff8ccf':'#7fe7ff');
      beep(it.type==='coin'?880:it.type==='flower'?660:1170,.15,'triangle');updHud();}}
  while(items.length<6)spawnItem();

  // varjo
  const total=cnt.coin+cnt.flower+cnt.gem;
  let vs=Math.min(120,50+total*1.6);if(P.glow>0)vs*=.4;
  const vd=Math.hypot(P.x-villain.x,P.y-villain.y)||1;
  const wob=Math.sin(time*2)*.5;
  villain.x+=((P.x-villain.x)/vd+wob*(P.y-villain.y)/vd*.4)*vs*dt;
  villain.y+=((P.y-villain.y)/vd-wob*(P.x-villain.x)/vd*.4)*vs*dt;
  printT-=dt;if(printT<=0){printT=.42;villain.step^=1;
    const ang=Math.atan2(P.y-villain.y,P.x-villain.x),off=villain.step?7:-7;
    prints.push({x:villain.x-Math.sin(ang)*off,y:villain.y+Math.cos(ang)*off,a:ang,l:2.6});}
  prints.forEach(p=>p.l-=dt);prints=prints.filter(p=>p.l>0);

  if(vd<P.r+16){
    if(P.glow>0){burst(villain.x,villain.y,'#d9b3ff',20);Object.assign(villain,farPoint());toast('Keijut ajoivat varjon pois!');beep(520,.3,'sine');}
    else if(P.inv<=0){hearts--;updHud();P.inv=2;burst(P.x,P.y,'#ffffff',16);beep(200,.35,'square',.08);
      Object.assign(villain,farPoint());
      if(hearts<=0){gameOver();return;}toast('Auts! Varjo yllätti!');}
  }

  // keiju
  fairyT-=dt;
  if(!fairy&&fairyT<=0){const side=Math.random()<.5;fairy={x:side?-20:W+20,y:rnd(b.y0+40,b.y1-40),tx:rnd(b.x0+60,b.x1-60),ty:rnd(b.y0+60,b.y1-60),l:10};toast('Keiju tuli auttamaan! ✨');beep(1320,.2);}
  if(fairy){fairy.l-=dt;
    const fx=fairy.tx+Math.cos(time*1.3)*50,fy=fairy.ty+Math.sin(time*2.1)*30;
    fairy.x+=(fx-fairy.x)*dt*1.5;fairy.y+=(fy-fairy.y)*dt*1.5;
    if(Math.random()<.4)parts.push({x:fairy.x,y:fairy.y+6,vx:rnd(-15,15),vy:rnd(10,30),l:.6,c:'#fff7a8'});
    if(dist(fairy,P)<P.r+20){P.glow=7;burst(fairy.x,fairy.y,'#fff7a8',24);fairy=null;fairyT=rnd(11,15);
      toast('Keijun taika! Nyt näet varjon');[880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*90));}
    else if(fairy.l<=0){fairy=null;fairyT=rnd(6,9);}
  }
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;});parts=parts.filter(p=>p.l>0);
}

/* ---------- Piirto ---------- */
function drawItem(it){const y=it.y+Math.sin(time*3+it.ph)*3;ctx.save();ctx.translate(it.x,y);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,14,10,3,0,0,7);ctx.fill();
  if(it.type==='coin'){const sx=Math.abs(Math.cos(time*3+it.ph))*.6+.4;ctx.scale(sx,1);
    ctx.fillStyle='#e0a21c';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
    ctx.fillStyle='#ffd44a';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
    ctx.fillStyle='#fff3b0';ctx.fillRect(-1.5,-5,3,10);}
  else if(it.type==='flower'){ctx.rotate(Math.sin(time+it.ph)*.2);ctx.fillStyle='#ff8ccf';
    for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(Math.cos(k*1.256)*7,Math.sin(k*1.256)*7,6,4.5,k*1.256,0,7);ctx.fill();}
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(0,0,4.5,0,7);ctx.fill();}
  else{ctx.fillStyle='#4fd3f5';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(10,-3);ctx.lineTo(0,12);ctx.lineTo(-10,-3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#bff4ff';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(4,-3);ctx.lineTo(0,4);ctx.lineTo(-4,-3);ctx.closePath();ctx.fill();
    if(Math.sin(time*4+it.ph)>.8){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-8,2,0,7);ctx.fill();}}
  ctx.restore();}

function drawPrincess(){
  if(P.inv>0&&Math.floor(P.inv*10)%2===0)return;
  const bob=Math.abs(Math.sin(P.walk))*3;ctx.save();ctx.translate(P.x,P.y-bob);
  if(P.glow>0){const g=ctx.createRadialGradient(0,0,10,0,0,48);g.addColorStop(0,'rgba(255,247,168,.7)');g.addColorStop(1,'rgba(255,247,168,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,48,0,7);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,26+bob,18,5,0,0,7);ctx.fill();
  ctx.scale(P.face,1);
  // mekko
  ctx.fillStyle='#ff6fae';ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(7,-2);ctx.quadraticCurveTo(18,14,20,24);ctx.lineTo(-20,24);ctx.quadraticCurveTo(-18,14,-7,-2);ctx.fill();
  ctx.fillStyle='#d9468a';for(let k=-3;k<=3;k++){ctx.beginPath();ctx.arc(k*6,24,3.5,0,Math.PI);ctx.fill();}
  ctx.fillStyle='#ffb3d4';ctx.fillRect(-7,-3,14,6);
  // kädet
  ctx.fillStyle='#f6c7a5';const sw=Math.sin(P.walk)*3;
  ctx.beginPath();ctx.arc(-11,6+sw,3.5,0,7);ctx.arc(11,6-sw,3.5,0,7);ctx.fill();
  // hiukset taakse
  ctx.fillStyle='#5a3220';ctx.beginPath();ctx.arc(0,-14,13,Math.PI*.9,Math.PI*2.1);ctx.fill();
  for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(-11+k*7.3,-4+(k%2)*2,5,0,7);ctx.fill();}
  // pää
  ctx.fillStyle='#f6c7a5';ctx.beginPath();ctx.arc(0,-13,10,0,7);ctx.fill();
  // otsatukka
  ctx.fillStyle='#5a3220';ctx.beginPath();ctx.arc(-4,-21,6,0,7);ctx.arc(4,-21,6,0,7);ctx.fill();
  // kasvot
  ctx.fillStyle='#3b1a3e';ctx.beginPath();ctx.arc(-3.5,-12,1.6,0,7);ctx.arc(4,-12,1.6,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,120,150,.5)';ctx.beginPath();ctx.arc(-6,-8,2.2,0,7);ctx.arc(7,-8,2.2,0,7);ctx.fill();
  ctx.strokeStyle='#b0405e';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0.5,-8.5,2.4,.2,Math.PI-.2);ctx.stroke();
  // kukkaseppele
  for(let k=0;k<5;k++){const a=Math.PI*1.15+k*.18*Math.PI;const x=Math.cos(a)*11,y=-14+Math.sin(a)*11;
    ctx.fillStyle=k%2?'#ffffff':'#ffe066';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();}
  ctx.restore();}

function drawVillain(){
  const d=Math.hypot(P.x-villain.x,P.y-villain.y);
  // tassunjäljet
  prints.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a+Math.PI/2);ctx.fillStyle=`rgba(70,20,90,${.32*Math.min(1,p.l)})`;
    ctx.beginPath();ctx.ellipse(0,0,4,5.5,0,0,7);ctx.fill();
    [[-4,-6],[0,-8],[4,-6]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1.8,0,7);ctx.fill();});ctx.restore();});
  // näkyvä vain keijun taialla
  if(P.glow>0){ctx.save();ctx.translate(villain.x,villain.y+Math.sin(time*4)*3);ctx.globalAlpha=.75;
    ctx.fillStyle='#7a3fa8';ctx.beginPath();ctx.arc(0,-4,16,Math.PI,0);ctx.lineTo(16,12);
    for(let k=0;k<4;k++)ctx.lineTo(16-(k+.5)*8,12+((k%2)?-5:0)),ctx.lineTo(16-(k+1)*8,12);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-5,4,0,7);ctx.arc(6,-5,4,0,7);ctx.fill();
    ctx.fillStyle='#2a0d3a';ctx.beginPath();ctx.arc(-5,-4,2,0,7);ctx.arc(7,-4,2,0,7);ctx.fill();ctx.restore();}
  // reunojen hehku kun varjo lähellä
  if(d<220&&P.glow<=0){const a=(1-d/220)*.55;const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    g.addColorStop(0,'rgba(80,20,110,0)');g.addColorStop(1,`rgba(80,20,110,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
}

function drawFairy(){if(!fairy)return;ctx.save();ctx.translate(fairy.x,fairy.y);
  const g=ctx.createRadialGradient(0,0,2,0,0,26);g.addColorStop(0,'rgba(255,250,190,.9)');g.addColorStop(1,'rgba(255,250,190,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();
  const f=Math.abs(Math.sin(time*18));ctx.fillStyle='rgba(190,240,255,.85)';
  ctx.beginPath();ctx.ellipse(-8,-4,8*f+2,5,-.5,0,7);ctx.ellipse(8,-4,8*f+2,5,.5,0,7);ctx.fill();
  ctx.fillStyle='#9ee6a0';ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(5,9);ctx.lineTo(-5,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f6c7a5';ctx.beginPath();ctx.arc(0,-6,4,0,7);ctx.fill();
  ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(0,-9,3.5,Math.PI,0);ctx.fill();
  ctx.restore();}

function draw(){
  ctx.drawImage(bg,0,0,W,H);
  drawVillain();
  items.forEach(drawItem);
  drawFairy();
  drawPrincess();
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/.7);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();});ctx.globalAlpha=1;
}

/* ---------- Silmukka ---------- */
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='play')update(dt);else time+=dt;
  if(P)draw();else ctx.drawImage(bg,0,0,W,H);
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function start(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();}catch(e){}
  reset();state='play';$('overlay').hidden=true;}
function gameOver(){state='over';const tot=cnt.coin+cnt.flower+cnt.gem;let best=0;
  try{best=+localStorage.getItem('kielo-best')||0;if(tot>best){localStorage.setItem('kielo-best',tot);best=tot;}}catch(e){best=Math.max(best,tot);}
  $('card').innerHTML=`<h1>Hienosti kerätty!</h1>
    <div class="score">🪙 ${cnt.coin} &nbsp; 🌸 ${cnt.flower} &nbsp; 💎 ${cnt.gem}</div>
    <p>Yhteensä ${tot} aarretta. Paras tulos: ${best}</p>
    <button class="big" id="go">Pelaa uudestaan</button>`;
  $('go').onclick=start;$('overlay').hidden=false;beep(330,.4,'triangle');}
$('go').onclick=start;
</script>
